name: ChapterOne Nest YAML Workflow

on:
  push:
    branches:
      - daily_task

jobs:
  build:
    name: Run Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Node Setup Completed
        run: echo 'Node Js Working Successfull'

      - name: Run tests
        run: echo 'Unit Test Executed Successfully'

      - name: Run EsLint
        run: |
          echo 'EsLint Running...'
          echo 'All Files Pass Linting'

  
  unit:
    name: Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Node Setup Completed
        run: echo 'Node Js Working Successfull'

      - name: Controller Unit Test
        run: echo 'Unit Test Executed Successfully'
  
      - name: Deployment Successfull
        run: echo 'Server NestJs Build Deployment process completed successfull visit chapterone.com'