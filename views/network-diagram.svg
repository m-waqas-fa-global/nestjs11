<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%" style="background:#090d16; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="greenLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="redLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Path definitions for animations -->
    <path id="pathLan1" d="M 180 140 L 410 260" fill="none"/>
    <path id="pathLan2" d="M 180 270 L 410 270" fill="none"/>
    <path id="pathLan3" d="M 180 400 L 410 280" fill="none"/>
    
    <path id="pathAllowed" d="M 690 270 L 920 270" fill="none"/>
    <path id="pathBlocked" d="M 550 350 L 550 490" fill="none"/>
  </defs>

  <style>
    /* Realtime Pulsing Animations */
    @keyframes pulseDash {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingSlow {
      0% { r: 6px; opacity: 1; }
      50% { r: 14px; opacity: 0.3; }
      100% { r: 6px; opacity: 1; }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes blockFlicker {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.97); }
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: pulseDash 1.2s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 8 12;
      animation: pulseDash 1.2s linear infinite reverse;
    }
    .ping-ring {
      animation: pingSlow 2s ease-in-out infinite;
    }
    .blocked-zone {
      animation: blockFlicker 1.8s ease-in-out infinite;
    }
  </style>

  <!-- Background Grid & Aura -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>
  
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(60, 48)">
    <circle cx="12" cy="12" r="8" fill="#10b981" filter="url(#greenGlow)"/>
    <circle cx="12" cy="12" r="14" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6" class="ping-ring"/>
    <text x="36" y="18" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="0.5">SHIELDFLOW GATEWAY &amp; TRAFFIC CONTROLLER</text>
    <text x="36" y="38" fill="#94a3b8" font-size="13">Realtime Network Traffic Routing &amp; L7 Firewall Interception</text>
  </g>

  <!-- TRAFFIC FLOW PATHS (Background conduits) -->
  <!-- LAN -> Gateway Conduits -->
  <path d="M 180 140 L 410 260" stroke="#0284c7" stroke-width="4" stroke-opacity="0.3" fill="none"/>
  <path d="M 180 270 L 410 270" stroke="#0284c7" stroke-width="4" stroke-opacity="0.3" fill="none"/>
  <path d="M 180 400 L 410 280" stroke="#0284c7" stroke-width="4" stroke-opacity="0.3" fill="none"/>

  <!-- Animated Active Pulses (LAN -> Gateway) -->
  <path d="M 180 140 L 410 260" stroke="#38bdf8" stroke-width="3" fill="none" class="flow-line-reverse" filter="url(#cyanGlow)"/>
  <path d="M 180 270 L 410 270" stroke="#38bdf8" stroke-width="3" fill="none" class="flow-line-reverse" filter="url(#cyanGlow)"/>
  <path d="M 180 400 L 410 280" stroke="#38bdf8" stroke-width="3" fill="none" class="flow-line-reverse" filter="url(#cyanGlow)"/>

  <!-- Allowed Outbound to Internet -->
  <path d="M 690 270 L 920 270" stroke="#059669" stroke-width="4" stroke-opacity="0.3" fill="none"/>
  <path d="M 690 270 L 920 270" stroke="#10b981" stroke-width="3.5" fill="none" class="flow-line-reverse" filter="url(#greenGlow)"/>

  <!-- Blocked Requests Drop Line -->
  <path d="M 550 360 L 550 460" stroke="#dc2626" stroke-width="3" stroke-opacity="0.4" fill="none"/>
  <path d="M 550 360 L 550 460" stroke="#ef4444" stroke-width="3" fill="none" class="flow-line-reverse" filter="url(#redGlow)"/>


  <!-- 1. LEFT ZONE: LAN CLIENTS -->
  <g transform="translate(60, 90)">
    <!-- Container Box -->
    <rect width="130" height="360" rx="14" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.5"/>
    <text x="65" y="32" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">LOCAL LAN</text>
    <text x="65" y="48" fill="#64748b" font-size="10" text-anchor="middle">192.168.1.0/24</text>

    <!-- Node 1: Workstation -->
    <g transform="translate(25, 65)">
      <rect width="80" height="44" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="40" y="24" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Desktop PC</text>
      <text x="40" y="37" fill="#94a3b8" font-size="9" text-anchor="middle">.102</text>
    </g>

    <!-- Node 2: Laptop -->
    <g transform="translate(25, 155)">
      <rect width="80" height="44" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="40" y="24" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Dev Laptop</text>
      <text x="40" y="37" fill="#94a3b8" font-size="9" text-anchor="middle">.108</text>
    </g>

    <!-- Node 3: Mobile -->
    <g transform="translate(25, 245)">
      <rect width="80" height="44" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="40" y="24" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Mobile Wi-Fi</text>
      <text x="40" y="37" fill="#94a3b8" font-size="9" text-anchor="middle">.115</text>
    </g>
  </g>


  <!-- 2. CENTER ZONE: SHIELDFLOW GATEWAY & FIREWALL -->
  <g transform="translate(410, 100)">
    <!-- Main Outer Container -->
    <rect width="280" height="300" rx="18" fill="url(#serverGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#cyanGlow)"/>
    
    <!-- Title Bar -->
    <rect width="280" height="45" rx="18" fill="#0f172a" fill-opacity="0.9"/>
    <text x="140" y="28" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.5">SHIELDFLOW GATEWAY</text>

    <!-- Sub-module 1: NIC 1 (LAN Gateway) -->
    <g transform="translate(20, 60)">
      <rect width="240" height="42" rx="8" fill="#0b1329" stroke="#0ea5e9" stroke-width="1"/>
      <circle cx="16" cy="21" r="5" fill="#38bdf8"/>
      <text x="32" y="24" fill="#e2e8f0" font-size="11" font-weight="600">NIC 1 (eth1): 192.168.1.1</text>
      <text x="32" y="36" fill="#64748b" font-size="9">Default Gateway &amp; DHCP Opt 252</text>
    </g>

    <!-- Sub-module 2: Firewall & NAT Routing Engine -->
    <g transform="translate(20, 114)">
      <rect width="240" height="48" rx="8" fill="#0b1329" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="16" cy="24" r="5" fill="#f59e0b"/>
      <text x="32" y="22" fill="#fbbf24" font-size="11" font-weight="600">iptables NAT &amp; Packet Filter</text>
      <text x="32" y="38" fill="#94a3b8" font-size="9">Force Web (80/443) -> Proxy Port 3128</text>
    </g>

    <!-- Sub-module 3: ShieldFlow L7 Forward Proxy Engine -->
    <g transform="translate(20, 174)">
      <rect width="240" height="56" rx="8" fill="#141c2e" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="16" cy="28" r="6" fill="#10b981" filter="url(#greenGlow)"/>
      <text x="32" y="24" fill="#34d399" font-size="12" font-weight="700">ShieldFlow Proxy (:3128)</text>
      <text x="32" y="39" fill="#94a3b8" font-size="9">HTTP CONNECT Tunnel &amp; Domain Filter</text>
      <text x="32" y="50" fill="#64748b" font-size="9">Web Management UI: Port 3000</text>
    </g>

    <!-- Sub-module 4: NIC 2 (WAN Interface) -->
    <g transform="translate(20, 242)">
      <rect width="240" height="42" rx="8" fill="#0b1329" stroke="#10b981" stroke-width="1"/>
      <circle cx="16" cy="21" r="5" fill="#10b981"/>
      <text x="32" y="24" fill="#e2e8f0" font-size="11" font-weight="600">NIC 2 (eth0): WAN / Internet</text>
      <text x="32" y="36" fill="#64748b" font-size="9">Public Uplink to ISP</text>
    </g>
  </g>


  <!-- 3. BOTTOM ZONE: BLOCKED TRAFFIC SINKHOLE -->
  <g transform="translate(450, 460)" class="blocked-zone">
    <rect width="200" height="60" rx="12" fill="#200d11" stroke="#ef4444" stroke-width="1.5" filter="url(#redGlow)"/>
    <text x="100" y="26" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">403 FORBIDDEN DROP</text>
    <text x="100" y="44" fill="#fca5a5" font-size="10" text-anchor="middle">Blocked Domains Terminated</text>
  </g>


  <!-- 4. RIGHT ZONE: GLOBAL INTERNET -->
  <g transform="translate(900, 160)">
    <!-- Globe Glow Circle -->
    <circle cx="100" cy="110" r="85" fill="#042f2e" fill-opacity="0.4" stroke="#10b981" stroke-width="2" filter="url(#greenGlow)"/>
    
    <!-- Outer Orbit Ring -->
    <ellipse cx="100" cy="110" rx="100" ry="30" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>

    <!-- Labels -->
    <text x="100" y="105" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="1">INTERNET</text>
    <text x="100" y="125" fill="#6ee7b7" font-size="11" text-anchor="middle">Allowed Web Traffic</text>
    
    <!-- Target badges -->
    <g transform="translate(35, 145)">
      <rect width="130" height="24" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
      <text x="65" y="16" fill="#d1fae5" font-size="10" text-anchor="middle">Safe SaaS / APIs / Web</text>
    </g>
  </g>

  <!-- LIVE INDICATORS & LEGEND -->
  <g transform="translate(60, 500)">
    <circle cx="10" cy="10" r="5" fill="#38bdf8"/>
    <text x="24" y="14" fill="#94a3b8" font-size="11">LAN Request (Inbound)</text>

    <circle cx="190" cy="10" r="5" fill="#10b981"/>
    <text x="204" y="14" fill="#94a3b8" font-size="11">Clean Traffic Allowed (Outbound)</text>

    <circle cx="430" cy="10" r="5" fill="#ef4444"/>
    <text x="444" y="14" fill="#94a3b8" font-size="11">Blocked Domain (403 Dropped)</text>
  </g>

</svg>
