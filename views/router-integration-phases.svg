<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1140" width="100%" height="100%" style="background:#070a13; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1021"/>
      <stop offset="50%" stop-color="#060914"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Phase 1: Cyan -->
    <linearGradient id="gradP1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e263d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081524" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Phase 2: Violet/Purple -->
    <linearGradient id="gradP2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f183c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0e0a22" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Phase 3: Amber/Rose -->
    <linearGradient id="gradP3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31171a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#19090c" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Phase 4: Emerald/Green -->
    <linearGradient id="gradP4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2920" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#051711" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .step-box {
      transition: all 0.2s ease;
    }
    .step-box:hover {
      filter: brightness(1.2);
    }
  </style>

  <!-- Base Grid Background -->
  <rect width="100%" height="100%" fill="url(#bgMain)"/>

  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <pattern id="gridPat" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#gridPat)"/>
  </g>

  <!-- ====================================================================== -->
  <!-- TOP HEADER BANNER                                                      -->
  <!-- ====================================================================== -->
  <g transform="translate(50, 36)">
    <rect width="1340" height="84" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Status Indicator -->
    <circle cx="36" cy="42" r="7" fill="#10b981" filter="url(#glowGreen)"/>
    <circle cx="36" cy="42" r="14" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.6"/>

    <!-- Title and Subtitle -->
    <text x="66" y="38" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="1">
      SHIELDFLOW NEST.JS GATEWAY &amp; FIREWALL — COMPLETE ROUTER INTEGRATION
    </text>
    <text x="66" y="60" fill="#94a3b8" font-size="12.5" font-weight="500">
      4-Phase Deployment Architecture for Home Routers &amp; ISP Networks • 1-Line Operational Steps
    </text>

    <!-- Version Badge -->
    <rect x="1130" y="26" width="180" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="1220" y="46" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">
      ROUTER SPEC v2.0
    </text>
  </g>


  <!-- ====================================================================== -->
  <!-- PHASE 1: PREPARE THE NEST.JS SERVER ON YOUR LOCAL NETWORK              -->
  <!-- ====================================================================== -->
  <g transform="translate(50, 140)">
    <rect width="1340" height="235" rx="16" fill="url(#gradP1)" stroke="#0284c7" stroke-width="2" filter="url(#glowCyan)"/>
    
    <!-- Header Bar -->
    <rect width="1340" height="48" rx="16" fill="#0369a1" fill-opacity="0.3"/>
    <rect x="18" y="10" width="105" height="28" rx="6" fill="#0284c7"/>
    <text x="70" y="29" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">PHASE 1</text>
    <text x="135" y="30" fill="#e0f2fe" font-size="15" font-weight="700">PREPARE THE NEST.JS SERVER ON YOUR LOCAL NETWORK</text>
    <text x="1320" y="30" fill="#7dd3fc" font-size="11.5" font-weight="600" text-anchor="end">SERVER FOUNDATION</text>

    <!-- Step 1 -->
    <g transform="translate(24, 60)" class="step-box">
      <rect width="1292" height="36" rx="8" fill="#08233b" stroke="#0284c7" stroke-width="0.8"/>
      <circle cx="20" cy="18" r="10" fill="#0284c7"/>
      <text x="20" y="22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">1</text>
      <text x="40" y="22" fill="#ffffff" font-size="12" font-weight="700">Step 1: Assign a Static Local IP to Your Server —</text>
      <text x="355" y="22" fill="#bae6fd" font-size="12">Reserve a permanent static IP (e.g., 192.168.1.100) for the computer running Nest.js inside your router's DHCP reservation page or Windows network settings.</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(24, 102)" class="step-box">
      <rect width="1292" height="36" rx="8" fill="#08233b" stroke="#0284c7" stroke-width="0.8"/>
      <circle cx="20" cy="18" r="10" fill="#0284c7"/>
      <text x="20" y="22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">2</text>
      <text x="40" y="22" fill="#ffffff" font-size="12" font-weight="700">Step 2: Bind Nest.js to All Network Interfaces (0.0.0.0) —</text>
      <text x="410" y="22" fill="#bae6fd" font-size="12">Ensure your proxy service in Nest.js listens on 0.0.0.0 so devices on the home network can reach ports 3128 (Proxy) and 3000 (Web UI).</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(24, 144)" class="step-box">
      <rect width="1292" height="36" rx="8" fill="#08233b" stroke="#0284c7" stroke-width="0.8"/>
      <circle cx="20" cy="18" r="10" fill="#0284c7"/>
      <text x="20" y="22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">3</text>
      <text x="40" y="22" fill="#ffffff" font-size="12" font-weight="700">Step 3: Open Firewall Ports on the Host Machine —</text>
      <text x="368" y="22" fill="#bae6fd" font-size="12">Add inbound firewall rules in Windows Defender / Linux ufw to permit TCP traffic on ports 3128 and 3000 from the local network subnet (192.168.1.0/24).</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(24, 186)" class="step-box">
      <rect width="1292" height="36" rx="8" fill="#08233b" stroke="#0284c7" stroke-width="0.8"/>
      <circle cx="20" cy="18" r="10" fill="#0284c7"/>
      <text x="20" y="22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">4</text>
      <text x="40" y="22" fill="#ffffff" font-size="12" font-weight="700">Step 4: Keep the Server Running Continuously via PM2 —</text>
      <text x="420" y="22" fill="#bae6fd" font-size="12">Install PM2 using npm install -g pm2 and start the server with pm2 start dist/main.js --name shieldflow so it automatically restarts after power outages or reboots.</text>
    </g>
  </g>


  <!-- ====================================================================== -->
  <!-- PHASE 2: CONFIGURE YOUR HOME ROUTER (CHOOSE 1 FLEXIBLE METHOD)         -->
  <!-- ====================================================================== -->
  <g transform="translate(50, 395)">
    <rect width="1340" height="375" rx="16" fill="url(#gradP2)" stroke="#8b5cf6" stroke-width="2" filter="url(#glowPurple)"/>
    
    <!-- Header Bar -->
    <rect width="1340" height="48" rx="16" fill="#6d28d9" fill-opacity="0.3"/>
    <rect x="18" y="10" width="105" height="28" rx="6" fill="#7c3aed"/>
    <text x="70" y="29" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">PHASE 2</text>
    <text x="135" y="30" fill="#f3e8ff" font-size="15" font-weight="700">CONFIGURE YOUR HOME ROUTER (CHOOSE 1 FLEXIBLE METHOD)</text>
    <text x="1320" y="30" fill="#c4b5fd" font-size="11.5" font-weight="600" text-anchor="end">ROUTER TRAFFIC INTERCEPTION</text>

    <!-- Sub-heading Method A -->
    <g transform="translate(24, 60)">
      <rect width="320" height="24" rx="6" fill="#4c1d95"/>
      <text x="12" y="16" fill="#e9d5ff" font-size="11" font-weight="700">METHOD A: DHCP Auto-Discovery (TP-Link, D-Link, Netgear, Tenda)</text>
    </g>

    <!-- Step 5 -->
    <g transform="translate(24, 90)" class="step-box">
      <rect width="1292" height="36" rx="8" fill="#171033" stroke="#7c3aed" stroke-width="0.8"/>
      <circle cx="20" cy="18" r="10" fill="#7c3aed"/>
      <text x="20" y="22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">5</text>
      <text x="40" y="22" fill="#ffffff" font-size="12" font-weight="700">Step 5: Log into Your Router Admin Dashboard —</text>
      <text x="360" y="22" fill="#ddd6fe" font-size="12">Open your web browser, navigate to your router's default IP (e.g., 192.168.1.1), and log in with your administrative credentials.</text>
    </g>

    <!-- Step 6 -->
    <g transform="translate(24, 132)" class="step-box">
      <rect width="1292" height="36" rx="8" fill="#171033" stroke="#7c3aed" stroke-width="0.8"/>
      <circle cx="20" cy="18" r="10" fill="#7c3aed"/>
      <text x="20" y="22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">6</text>
      <text x="40" y="22" fill="#ffffff" font-size="12" font-weight="700">Step 6: Configure DHCP Option 252 for Auto-Proxy (WPAD) —</text>
      <text x="445" y="22" fill="#ddd6fe" font-size="12">Go to DHCP Settings > Advanced Options, locate Option 252, and set the value to http://192.168.1.100:3000/wpad.dat to broadcast proxy to all Wi-Fi devices.</text>
    </g>

    <!-- Sub-heading Method B -->
    <g transform="translate(24, 180)">
      <rect width="360" height="24" rx="6" fill="#4c1d95"/>
      <text x="12" y="16" fill="#e9d5ff" font-size="11" font-weight="700">METHOD B: Transparent Redirection (OpenWrt, DD-WRT, AsusWRT, Mikrotik)</text>
    </g>

    <!-- Step 7 -->
    <g transform="translate(24, 210)" class="step-box">
      <rect width="1292" height="42" rx="8" fill="#171033" stroke="#7c3aed" stroke-width="0.8"/>
      <circle cx="20" cy="21" r="10" fill="#7c3aed"/>
      <text x="20" y="25" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">7</text>
      <text x="40" y="25" fill="#ffffff" font-size="12" font-weight="700">Step 7: Add iptables Port Redirection on the Router —</text>
      <text x="390" y="25" fill="#ddd6fe" font-size="11.5">Add a firewall rule (iptables -t nat -A PREROUTING -i br-lan -p tcp -m multiport --dports 80,443 -j DNAT --to 192.168.1.100:3128) to intercept all web traffic silently.</text>
    </g>

    <!-- Sub-heading Method C -->
    <g transform="translate(24, 264)">
      <rect width="360" height="24" rx="6" fill="#4c1d95"/>
      <text x="12" y="16" fill="#e9d5ff" font-size="11" font-weight="700">METHOD C: Default Gateway Routing (Dual-NIC / Dedicated Router Server)</text>
    </g>

    <!-- Step 8 -->
    <g transform="translate(24, 294)" class="step-box">
      <rect width="1292" height="36" rx="8" fill="#171033" stroke="#7c3aed" stroke-width="0.8"/>
      <circle cx="20" cy="18" r="10" fill="#7c3aed"/>
      <text x="20" y="22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">8</text>
      <text x="40" y="22" fill="#ffffff" font-size="12" font-weight="700">Step 8: Change Default Gateway in Router DHCP —</text>
      <text x="375" y="22" fill="#ddd6fe" font-size="12">Navigate to your router's DHCP Server Settings and change the broadcast Default Gateway IP from 192.168.1.1 to your Nest.js server's IP 192.168.1.100.</text>
    </g>
  </g>


  <!-- ====================================================================== -->
  <!-- PHASE 3: ENFORCE ROUTER FIREWALL (PREVENT BYPASS)                      -->
  <!-- ====================================================================== -->
  <g transform="translate(50, 790)">
    <rect width="1340" height="115" rx="16" fill="url(#gradP3)" stroke="#f43f5e" stroke-width="2" filter="url(#glowRose)"/>
    
    <!-- Header Bar -->
    <rect width="1340" height="42" rx="16" fill="#be123c" fill-opacity="0.3"/>
    <rect x="18" y="8" width="105" height="26" rx="6" fill="#e11d48"/>
    <text x="70" y="25" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">PHASE 3</text>
    <text x="135" y="26" fill="#ffe4e6" font-size="14.5" font-weight="700">ENFORCE ROUTER FIREWALL (PREVENT BYPASS)</text>
    <text x="1320" y="26" fill="#fda4af" font-size="11.5" font-weight="600" text-anchor="end">ZERO-TRUST ENFORCEMENT</text>

    <!-- Step 9 -->
    <g transform="translate(24, 55)" class="step-box">
      <rect width="1292" height="42" rx="8" fill="#240c12" stroke="#f43f5e" stroke-width="0.8"/>
      <circle cx="20" cy="21" r="10" fill="#f43f5e"/>
      <text x="20" y="25" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">9</text>
      <text x="40" y="25" fill="#ffffff" font-size="12" font-weight="700">Step 9: Block Direct Outbound Web Traffic on the Router —</text>
      <text x="430" y="25" fill="#fecdd3" font-size="12">Create an outbound firewall rule on your router to drop direct TCP ports 80 and 443 for all LAN clients, allowing direct internet access only for your Nest.js server IP (192.168.1.100).</text>
    </g>
  </g>


  <!-- ====================================================================== -->
  <!-- PHASE 4: VERIFICATION & TESTING                                        -->
  <!-- ====================================================================== -->
  <g transform="translate(50, 925)">
    <rect width="1340" height="150" rx="16" fill="url(#gradP4)" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)"/>
    
    <!-- Header Bar -->
    <rect width="1340" height="42" rx="16" fill="#047857" fill-opacity="0.3"/>
    <rect x="18" y="8" width="105" height="26" rx="6" fill="#059669"/>
    <text x="70" y="25" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">PHASE 4</text>
    <text x="135" y="26" fill="#ecfdf5" font-size="14.5" font-weight="700">VERIFICATION &amp; TESTING</text>
    <text x="1320" y="26" fill="#6ee7b7" font-size="11.5" font-weight="600" text-anchor="end">LIVE VALIDATION</text>

    <!-- Step 10 -->
    <g transform="translate(24, 52)" class="step-box">
      <rect width="1292" height="36" rx="8" fill="#062319" stroke="#10b981" stroke-width="0.8"/>
      <circle cx="20" cy="18" r="10" fill="#10b981"/>
      <text x="20" y="22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">10</text>
      <text x="40" y="22" fill="#ffffff" font-size="12" font-weight="700">Step 10: Reconnect Client Devices to Wi-Fi —</text>
      <text x="325" y="22" fill="#a7f3d0" font-size="12">Disconnect and reconnect any smartphone, TV, or laptop to the home Wi-Fi to receive the updated network settings automatically.</text>
    </g>

    <!-- Step 11 -->
    <g transform="translate(24, 96)" class="step-box">
      <rect width="1292" height="36" rx="8" fill="#062319" stroke="#10b981" stroke-width="0.8"/>
      <circle cx="20" cy="18" r="10" fill="#10b981"/>
      <text x="20" y="22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">11</text>
      <text x="40" y="22" fill="#ffffff" font-size="12" font-weight="700">Step 11: Validate Domain Block Enforcement —</text>
      <text x="345" y="22" fill="#a7f3d0" font-size="12">Open a browser on any connected phone or laptop and visit a blocked domain (e.g., tiktok.com) to confirm ShieldFlow terminates the connection with a 403 Forbidden error.</text>
    </g>
  </g>


  <!-- ====================================================================== -->
  <!-- FOOTER BAR                                                             -->
  <!-- ====================================================================== -->
  <g transform="translate(50, 1095)">
    <line x1="0" y1="0" x2="1340" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="22" fill="#64748b" font-size="11">ShieldFlow Proxy Project • Home Router &amp; Gateway Integration Blueprint</text>
    <text x="1340" y="22" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="end">PRODUCTION READY DEPLOYMENT SPECIFICATION</text>
  </g>

</svg>
